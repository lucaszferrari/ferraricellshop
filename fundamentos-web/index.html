<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ferrari cellshop - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Ferrari cellshop</h1>
      <p>Controle de celulares</p>
    </header>

    <main>
      <section class="cartao">
        <h2 id="titulo-form">Novo celular</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: iPhone 17 Pro" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 9999.90" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Ex: 10" required />

          <p id="erro-quantidade" class="erro" hidden>A quantidade deve ser maior que zero.</p>

          <button type="submit" id="botao-form">Adicionar produto</button>
        </form>
      </section>

      <section class="cartao">
        <h2>Celulares cadastrados</h2>
        <p id="contador">Produtos cadastrados: 0</p>
        <p id="lista-vazia" class="vazio" hidden>Nenhum produto cadastrado.</p>
        <ul id="lista-produtos"></ul>
      </section>
    </main>

    <footer id="rodape">
      <p>&copy; 2026 Ferrari cellshop — projeto de Fundamentos Web</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
